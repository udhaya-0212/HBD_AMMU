<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100b1a" />
    <meta name="description" content="A little birthday love story made for Esther." />
    <title>A Little Love Story for Esther</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <canvas id="world" aria-hidden="true"></canvas>
      <div class="grain" aria-hidden="true"></div>
      <div id="scene" aria-live="polite"></div>
      <div id="transition" aria-hidden="true"></div>
      <div id="effects" aria-live="polite"></div>
      <div class="top-tools">
        <button id="music-toggle" class="icon-button" type="button" aria-label="Play background music" title="Play music">♫</button>
        <label class="volume-wrap" aria-label="Music volume"><span>♪</span><input id="volume" type="range" min="0" max="1" step="0.05" value="0.45" /></label>
      </div>
      <div id="loading" class="loading"><div class="loader-heart">♥</div><p>Preparing a little surprise for you…</p></div>
    <audio id="music" loop preload="none"></audio>
    </div>
    <script>
      if (location.protocol === 'file:') {
        document.getElementById('app').innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:32px;background:#100b1a;color:#fff8f4;font:16px/1.6 Arial,sans-serif;text-align:center"><div><h1 style="font-family:Georgia,serif">One small step, Ammu 💗</h1><p>This story needs its local server to open correctly.</p><p>Close this tab, then double-click <strong>START STORY.bat</strong> in this folder.</p></div></main>';
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
